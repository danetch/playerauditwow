name: Déployer sur Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.clasp.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-appscript
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer clasp
        run: npm install -g @google/clasp@3

      - name: Identifiants Google
        env:
          CLASPRC: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC" ]; then echo "Secret CLASPRC_JSON manquant"; exit 1; fi
          printf '%s' "$CLASPRC" > ~/.clasprc.json

      - name: Envoyer src/ vers Apps Script
        run: clasp push --force
